[package]
name = "seedfinder"
version = "0.2.2"
description = "Local Minecraft Java seed finder"
edition = "2021"
rust-version = "1.77"

[lib]
name = "seedfinder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "seedfinder"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
