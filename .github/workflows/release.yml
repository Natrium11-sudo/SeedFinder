name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf

      - name: Build frontend, release tarball and AppImage
        run: |
          npm ci
          npm run build
          cargo build --release --manifest-path src-tauri/Cargo.toml
          bash scripts/build-release.sh
          npx --yes "@tauri-apps/cli@^2" build --bundles appimage
          mkdir -p release/appimage
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/appimage/
          cd release/appimage
          sha256sum *.AppImage > SHA256SUMS-appimage.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            release/seedfinder-*.tar.gz
            release/SHA256SUMS.txt
            release/appimage/*
            release/README.md
            release/RELEASE_NOTES.md
            release/LICENSES.md
            release/screenshots/**

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows installer
        run: |
          npm ci
          npm run build
          npx --yes "@tauri-apps/cli@^2" build --bundles nsis

      - name: Stage installer and checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/SeedFinder_${version}_x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Missing $installer" }
          New-Item -ItemType Directory -Force release/windows | Out-Null
          Copy-Item $installer release/windows/
          $name = Split-Path $installer -Leaf
          $hash = (Get-FileHash "release/windows/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content release/windows/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/windows/*

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: SeedFinder 0.1.0
          draft: false
          body_path: dist/linux-release/RELEASE_NOTES.md
          files: |
            dist/linux-release/appimage/*.AppImage
            dist/linux-release/appimage/SHA256SUMS-appimage.txt
            dist/linux-release/*.tar.gz
            dist/linux-release/SHA256SUMS.txt
            dist/windows-release/*.exe
            dist/windows-release/SHA256SUMS-windows.txt
